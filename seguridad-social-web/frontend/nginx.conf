events {
  worker_connections 1024;
}

http {
  # Tamaño máximo de solicitud (por si subes archivos grandes).
  client_max_body_size 20M; 

  # Ajustes SSL recomendados.
  ssl_session_cache    shared:SSL:10m;
  ssl_session_timeout  10m;
  ssl_session_tickets  off;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;

  # (Opcional) HTTP Strict Transport Security
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Ajustes de proxy
    proxy_read_timeout  180s;
    proxy_send_timeout  180s;

    # Servimos el frontend
    location / {
      proxy_pass http://frontend:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy para el backend
    location /backend {
      rewrite ^/backend/?(.*)$ /$1 break;
      proxy_pass http://backend:3001;

      # Añadimos cabeceras de CORS
      add_header 'Access-Control-Allow-Origin' 'https://124fb13fc5f7.ngrok.app' always;
      add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
      add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type' always;
      add_header 'Access-Control-Allow-Credentials' 'true' always;

      # Para manejar preflight requests (OPTIONS)
      if ($request_method = OPTIONS) {
        return 204;
      }

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy para el wallet (puerto 7101)
    location /wallet {
      # Si deseas que la ruta /wallet vaya "transparente"
      rewrite ^/wallet/?(.*)$ /$1 break;
      proxy_pass http://waltid-demo-wallet:7101;

      # (Opcional) Añadir cabeceras de CORS, si te hacen falta
       add_header 'Access-Control-Allow-Origin' 'https://124fb13fc5f7.ngrok.app' always;
       add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
       add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type' always;
       add_header 'Access-Control-Allow-Credentials' 'true' always;

      # Para manejar preflight requests (OPTIONS), si estás usando CORS
      # if ($request_method = OPTIONS) {
      #   return 204;
      # }

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # Redireccionar HTTP a HTTPS
  server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
  }
}