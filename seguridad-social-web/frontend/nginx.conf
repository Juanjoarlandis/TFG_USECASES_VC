# /etc/nginx/nginx.conf

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logs
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 20M;

    ## SSL settings
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  10m;
    ssl_session_tickets  off;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    #################################################################
    #                  Servidores virtuales                         #
    #################################################################

    # 1) Frontend + Backend + Wallet bajo TLS en el puerto 443
    server {
        listen       443 ssl;
        server_name  localhost;

        ssl_certificate      /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key  /etc/nginx/certs/privkey.pem;

        proxy_read_timeout   180s;
        proxy_send_timeout   180s;

        # --- Frontend React ---
        location / {
            proxy_pass          http://frontend:3000;
            proxy_set_header    Host               $host;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
        }

        # --- API Backend ---
        location /backend {
            rewrite ^/backend/?(.*)$ /$1 break;
            proxy_pass          http://backend:3001;

            # CORS
            add_header 'Access-Control-Allow-Origin'      'https://124fb13fc5f7.ngrok.app' always;
            add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers'     'Authorization,Content-Type' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;

            if ($request_method = OPTIONS) {
                return 204;
            }

            proxy_set_header    Host               $host;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
        }

        # --- WaltID Demo Wallet ---
        location /wallet {
            rewrite ^/wallet/?(.*)$ /$1 break;
            proxy_pass          http://waltid-demo-wallet:7101;

            # (Opcional) CORS
            add_header 'Access-Control-Allow-Origin'      'https://124fb13fc5f7.ngrok.app' always;
            add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers'     'Authorization,Content-Type' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;

            proxy_set_header    Host               $host;
            proxy_set_header    X-Real-IP          $remote_addr;
            proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto  $scheme;
        }
    }

    # 2) Redireccionar todo HTTP → HTTPS
    server {
        listen      80;
        server_name localhost;
        return 301  https://$host$request_uri;
    }
}
