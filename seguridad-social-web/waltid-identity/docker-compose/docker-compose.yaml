version: '3.8'

services:
  wallet-api:
    container_name: wallet-api
    image: docker.io/waltid/wallet-api:${VERSION_TAG:-latest}
    build:
      context: ../
      dockerfile: waltid-services/waltid-wallet-api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      caddy:
        condition: service_started
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - my_network
    volumes:
      - ./wallet-api/config:/waltid-wallet-api/config
      - ./wallet-api/walt.yaml:/waltid-wallet-api/walt.yaml
      - ./wallet-api/data:/waltid-wallet-api/data

  issuer-api:
    container_name: issuer-api
    platform: linux/x86_64
    image: docker.io/waltid/issuer-api:${VERSION_TAG:-latest}
    build:
      context: ../
      dockerfile: waltid-services/waltid-issuer-api/Dockerfile
    depends_on:
      - caddy
    env_file:
      - .env
    networks:
      - my_network
    volumes:
      - ./issuer-api/config:/waltid-issuer-api/config

  verifier-api:
    container_name: verifier-api
    platform: linux/x86_64
    image: docker.io/waltid/verifier-api:${VERSION_TAG:-latest}
    build:
      context: ../
      dockerfile: waltid-services/waltid-verifier-api/Dockerfile
    depends_on:
      - caddy
    env_file:
      - .env
    networks:
      - my_network
    volumes:
      - ./verifier-api/config:/waltid-verifier-api/config

  waltid-demo-wallet:
    container_name: waltid-demo-wallet
    image: docker.io/juanjoarlandis/waltid-demo-wallet-custom-tfg:1.0.1
    build:
      context: ../
      dockerfile: waltid-applications/waltid-web-wallet/apps/waltid-demo-wallet/Dockerfile
    depends_on:
      - wallet-api
      - caddy
    environment:
      NUXT_PUBLIC_ISSUER_CALLBACK_URL: "http://localhost:$DEMO_WALLET_FRONTEND_PORT"
      NUXT_PUBLIC_DEV_WALLET_URL: "http://localhost:$DEV_WALLET_FRONTEND_PORT"
      PORT: $DEMO_WALLET_FRONTEND_PORT
    networks:
      - my_network

  waltid-dev-wallet:
    container_name: waltid-dev-wallet
    image: docker.io/waltid/waltid-dev-wallet:${VERSION_TAG:-latest}
    build:
      context: ../
      dockerfile: waltid-applications/waltid-web-wallet/apps/waltid-dev-wallet/Dockerfile
    depends_on:
      - wallet-api
      - caddy
    environment:
      NUXT_PUBLIC_ISSUER_CALLBACK_URL: "http://localhost:$DEV_WALLET_FRONTEND_PORT"
      NUXT_PUBLIC_DEMO_WALLET_URL: "http://localhost:$DEMO_WALLET_FRONTEND_PORT"
      PORT: $DEV_WALLET_FRONTEND_PORT
    networks:
      - my_network

  web-portal:
    container_name: web-portal
    platform: linux/x86_64
    image: docker.io/waltid/portal:${VERSION_TAG:-latest}
    build:
      context: ../
      dockerfile: waltid-applications/waltid-web-portal/Dockerfile
    depends_on:
      - caddy
    environment:
      NEXT_PUBLIC_VC_REPO: "http://localhost:$VC_REPO_PORT"
      NEXT_PUBLIC_ISSUER: "http://localhost:$ISSUER_API_PORT"
      NEXT_PUBLIC_VERIFIER: "http://localhost:$VERIFIER_API_PORT"
      NEXT_PUBLIC_WALLET: "http://localhost:$DEMO_WALLET_FRONTEND_PORT"
      PORT: $WEB_PORTAL_PORT
    networks:
      - my_network

  vc-repo:
    container_name: vc-repo
    platform: linux/x86_64
    image: juanjoarlandisg25/waltid-vc-repository:10.0
    build:
      context: ../
    depends_on:
      - caddy
    environment:
      PORT: $VC_REPO_PORT
    networks:
      - my_network

  postgres:
    container_name: postgres
    image: postgres
    profiles:
      - postgres
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-U", "$DB_USERNAME" ]
      interval: 5s
      timeout: 1s
      retries: 5
    restart: always
    environment:
      POSTGRES_DB: $DB_NAME
      POSTGRES_USER: $DB_USERNAME
      POSTGRES_PASSWORD: $DB_PASSWORD
    volumes:
      - wallet-api-db:/waltid-wallet-api/data
    ports:
      - $POSTGRES_DB_PORT:5432
    networks:
      - my_network

  caddy:
    container_name: caddy
    image: docker.io/caddy:2
    restart: unless-stopped
    env_file:
      - .env
    cap_add:
      - NET_ADMIN
    ports:
      - target: "$WALLET_BACKEND_PORT"
        published: $WALLET_BACKEND_PORT
        protocol: tcp
        mode: host

      - target: "$ISSUER_API_PORT"
        published: $ISSUER_API_PORT
        protocol: tcp
        mode: host

      - target: "$VERIFIER_API_PORT"
        published: $VERIFIER_API_PORT
        protocol: tcp
        mode: host

      - target: "$DEMO_WALLET_FRONTEND_PORT"
        published: $DEMO_WALLET_FRONTEND_PORT
        protocol: tcp
        mode: host

      - target: "$DEV_WALLET_FRONTEND_PORT"
        published: $DEV_WALLET_FRONTEND_PORT
        protocol: tcp
        mode: host

      - target: "$WEB_PORTAL_PORT"
        published: $WEB_PORTAL_PORT
        protocol: tcp
        mode: host

      - target: "$VC_REPO_PORT"
        published: $VC_REPO_PORT
        protocol: tcp
        mode: host

      - target: "$PG_ADMIN_PORT"
        published: $PG_ADMIN_PORT
        protocol: tcp
        mode: host

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    networks:
      - my_network

volumes:
  wallet-api-db:

networks:
  my_network:
    external: false
    driver: bridge
