version: "3.8"

services:
  issuer_coord:
    container_name: issuer_coord
    image: juanjoarlandis/seguridad-social-web-issuer_coord:latest
    build: ./issuer_coord
    env_file:
      - ./issuer_coord/.env
      - ./vault-init/env/vault_approle.env
    environment:
      MONGODB_URI: "mongodb://mongo-issuer_coord:27017/issuercoord?authSource=admin"
    ports:
      - "5500:5500"
    networks:
      - my_network
    depends_on:
      - backend
      - mongo-issuer_coord

  backend:
    container_name: backend
    image: juanjoarlandis/seguridad-social-web-backend:latest
    build: ./backend
    environment:
      MONGO_URI: "mongodb://mongo-backend:27017/seguridadSocial"
    expose:
      - "3001"
    networks:
      - my_network
    depends_on:
      - mongo-backend

  mongo-backend:
    container_name: mongo-backend
    image: mongo:5.0
    networks:
      - my_network

  mongo-issuer_coord:
    container_name: mongo-issuer_coord
    image: mongo:5.0
    networks:
      - my_network

  frontend:
    container_name: frontend
    image: juanjoarlandis/seguridad-social-web-frontend:latest
    build: ./frontend
    environment:
      # El frontend consumirá el backend a través de nginx, en https://localhost/backend
      REACT_APP_BACKEND_URL: "https://localhost/backend"
    expose:
      - "3000"
    networks:
      - my_network
    depends_on:
      - backend

  nginx:
    image: nginx:latest
    container_name: nginx
    # Montamos los certificados y la configuración de Nginx desde el directorio frontend
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    ports:
      - "443:443"
      - "80:80"
    networks:
      - my_network
    restart: unless-stopped

networks:
  my_network:
    external: true
    name: my_network
