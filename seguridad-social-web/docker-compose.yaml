
services:
  # ─────────────────── ISSUER COORD ───────────────────
  issuer_coord:
    container_name: issuer_coord
    build: ./issuer_coord
    image: juanjoarlandisg25/seguridad-social-web-issuer_coord:latest
    env_file:
      - ./issuer_coord/.env
      - ./vault-init/env/vault_approle.env
    environment:
      # apunta al contenedor de mongo de issuer_coord
      MONGODB_URI: "mongodb://mongo-issuer_coord:27017/issuercoord?authSource=admin"
    ports:
      - "5500:5500"        # expuesto al host (opcional si sólo lo usas desde nginx)
    networks:
      - my_network
    depends_on:
      - backend
      - mongo-issuer_coord

  # ───────────────────── BACKEND API ───────────────────
  backend:
    container_name: backend
    build: ./backend
    image: juanjoarlandisg25/seguridad-social-web-backend:latest
    environment:
      MONGO_URI:  "mongodb://mongo-backend:27017/seguridadSocial"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
    expose:
      - "3001"             # sólo interno (lo consumirá nginx)
    networks:
      - my_network
    depends_on:
      - mongo-backend
      - redis

  # ──────────────────── REDIS CACHE ────────────────────
  redis:
    container_name: redis
    image: redis:latest
    ports:
      - "6379:6379"        # quítalo si no necesitas acceder desde el host
    networks:
      - my_network
    depends_on:
      - mongo-backend

  # ──────────────────── MONGOS ─────────────────────────
  mongo-backend:
    container_name: mongo-backend
    image: mongo:5.0
    networks:
      - my_network

  mongo-issuer_coord:
    container_name: mongo-issuer_coord
    image: mongo:5.0
    networks:
      - my_network

  # ───────────────────── FRONTEND ──────────────────────
  frontend:
    container_name: frontend
    build: ./frontend
    image: juanjoarlandisg25/seguridad-social-web-frontend:latest   # ← imagen propia
    environment:
      # Asegura que el servidor React/Next/Vite escuche en 0.0.0.0:3000
      HOST: "0.0.0.0"
      PORT: "3000"
      REACT_APP_BACKEND_URL: "https://localhost/backend"
    expose:
      - "3000"
    networks:
      - my_network
    depends_on:
      - backend
    restart: unless-stopped   # reinicia si falla el build o se cae

  # ───────────────────── NGINX PROXY ───────────────────
  nginx:
    container_name: nginx
    image: nginx:1.27-alpine
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    ports:
      - "443:443"
      - "80:80"
    networks:
      - my_network
    restart: unless-stopped

# ──────────────────── RED DOCKER ───────────────────────
networks:
  my_network:
    external: true          # ya tienes bridge creado con este nombre
